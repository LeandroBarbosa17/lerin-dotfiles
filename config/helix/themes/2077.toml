# ========================== Syntax ==========================

'attribute' = { fg = 'yellow' }

'constructor' = { fg = 'blue', modifiers = ['bold'] }

'constant' = { fg = 'red' }
'constant.builtin' = { fg = 'red' }
'constant.numeric' = { fg = 'yellow' }
'constant.character' = { fg = 'green' }

'string' = { fg = 'green' }
'string.regexp' = { fg = 'yellow' }

'comment' = { fg = 'black', modifiers = ['italic'] }

'variable' = { fg = 'fg' }
'variable.builtin' = { fg = 'cyan' }
'variable.parameter' = { fg = 'white' }
'variable.other.member' = { fg = 'blueb' }

'label' = { fg = 'yellow' }

'punctuation' = { fg = 'whiteb' }
'punctuation.bracket' = { fg = 'whiteb' }
'punctuation.delimiter' = { fg = 'whiteb' }

'keyword' = { fg = 'red', modifiers = ['bold'] }
'keyword.control' = { fg = 'red', modifiers = ['bold'] }
'keyword.control.import' = { fg = 'cyan' }

'operator' = { fg = 'yellow' }

'directive' = { fg = 'magenta' }

'special' = { fg = 'yellow' }

'namespace' = { fg = 'magentab', modifiers = ['italic'] }

'function' = { fg = 'blue' }
'function.method' = { fg = 'cyan' }
'function.builtin' = { fg = 'yellow' }

'tag' = { fg = 'red' }

'type' = { fg = 'magenta', modifiers = ['bold'] }
'type.builtin' = { fg = 'magentab', modifiers = ['italic'] }

# ========================== Markdown ==========================

'markup.heading' = { fg = 'red', modifiers = ['bold'] }
'markup.bold' = { fg = 'yellow', modifiers = ['bold'] }
'markup.italic' = { fg = 'cyan', modifiers = ['italic'] }
'markup.link.url' = { fg = 'blue' }
'markup.link.text' = { fg = 'cyan' }
'markup.list' = { fg = 'yellow' }
'markup.raw' = { fg = 'green' }

# ========================== Diff ==========================

'diff.delta' = { fg = 'blue' }
'diff.minus' = { fg = 'red' }
'diff.plus' = { fg = 'green' }

# ========================== UI ==========================

'ui.background' = { bg = 'bg' }

'ui.text' = { fg = 'fg' }

'ui.cursor' = { fg = 'bg', bg = 'red' }

'ui.window' = { fg = 'black' }

'ui.linenr' = { fg = 'black' }
'ui.linenr.selected' = { fg = 'cyan', modifiers = ['bold'] }

'ui.statusline' = { fg = 'cyan', bg = 'accent_color' }
'ui.statusline.inactive' = { fg = 'black' }

'ui.bufferline' = { fg = 'black' }
'ui.bufferline.active' = { fg = 'fg', bg = 'accent_color', modifiers = ['bold'] }

'ui.selection' = { bg = 'magentab' }

'ui.highlight' = { bg = 'accent_color' }

'ui.cursorline' = { bg = 'accent_color' }

'ui.menu' = { fg = 'fg', bg = 'accent_color' }

'ui.menu.selected' = { fg = 'bg', bg = 'cyan' }

'ui.popup' = { fg = 'fg', bg = 'accent_color' }

'ui.popup.info' = { fg = 'cyan', bg = 'accent_color', modifiers = ['bold'] }

'ui.virtual.ruler' = { bg = 'blackb' }

# ========================== Diagnostics ==========================

'error' = { fg = 'red', modifiers = ['bold'] }
'warning' = { fg = 'yellow', modifiers = ['bold'] }
'info' = { fg = 'blue', modifiers = ['bold'] }
'hint' = { fg = 'cyan', modifiers = ['bold'] }

'diagnostic.error' = { underline = { color = 'red', style = 'curl' } }
'diagnostic.warning' = { underline = { color = 'yellow', style = 'curl' } }
'diagnostic.info' = { underline = { color = 'blue', style = 'curl' } }
'diagnostic.hint' = { underline = { color = 'cyan', style = 'curl' } }

# ========================== Palette ==========================

[palette]

bg="#070219"
fg="#27fbfe"

black="#626483"
red="#fb007a"
green="#a6e22e"
yellow="#f3e430"
blue="#19bffe"
magenta="#6800d2"
cyan="#43fbff"
white="#d5ddee"

blackb="#626483"
redb="#fb007a"
greenb="#a6e22e"
yellowb="#f3e430"
blueb="#58AFC2"
magentab="#472575"
cyanb="#926BCA"
whiteb="#d5ddee"

accent_color="#09021f"
